<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174c80">
<title>TSE Smart Attendance</title>
<style>
body{font-family:Arial;background:#f2f5f9;margin:0;padding:20px;text-align:center}
.card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto}
h2{color:#174c80}
button{padding:13px 20px;border:0;border-radius:9px;background:#174c80;color:white;margin:6px;font-size:16px}
input{box-sizing:border-box;padding:12px;width:90%;margin:8px;border:1px solid #ccc;border-radius:8px}
#reader{width:100%;margin-top:15px}
.item{padding:10px;border-bottom:1px solid #ddd;text-align:left}
#status{color:#174c80;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<h2>TSE Smart Attendance</h2>
<p>Offline QR Attendance System</p>

<h3 id="clock">Loading...</h3>

<div id="reader"></div>
<button onclick="startScan()">Start Scanner</button>
<button onclick="stopScan()">Stop Scanner</button>

<p id="status">Ready to scan</p>

<h3>Manual ID Entry</h3>
<input id="memberID" placeholder="Enter Member ID">
<input id="memberName" placeholder="Member Name">
<button onclick="manualSave()">Save Attendance</button>

<h3>Attendance Records</h3>
<div id="records"></div>
<button onclick="exportCSV()">Download Records</button>
</div>

<!-- LOCAL QR LIBRARY -->
<script src="./html5-qrcode.min.js"></script>

<script>
// OFFLINE SERVICE WORKER
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.log(error));
  });
}

let scanner;
let records = JSON.parse(localStorage.getItem("tse_records") || "[]");

// ETHIOPIA TIME
function ethiopianTime() {
  return new Date().toLocaleString("en-US", {
    timeZone: "Africa/Addis_Ababa",
    dateStyle: "full",
    timeStyle: "medium"
  });
}

function updateClock() {
  document.getElementById("clock").innerText = ethiopianTime();
}
setInterval(updateClock, 1000);
updateClock();

// SAVE ATTENDANCE
function save(id, name) {
  let now = new Date();

  let day = now.toLocaleDateString("en-US", {
    timeZone: "Africa/Addis_Ababa"
  });

  if (records.some(r => r.id === id && r.day === day)) {
    document.getElementById("status").innerText =
      "Already registered today!";
    return;
  }

  records.push({
    id: id,
    name: name,
    day: day,
    time: now.toLocaleTimeString("en-US", {
      timeZone: "Africa/Addis_Ababa"
    }),
    timestamp: now.toISOString(),
    synced: false
  });

  localStorage.setItem("tse_records", JSON.stringify(records));
  render();

  document.getElementById("status").innerText =
    "Attendance saved offline!";
}

// MANUAL ENTRY
function manualSave() {
  let id = document.getElementById("memberID").value.trim();
  let name = document.getElementById("memberName").value.trim();

  if (!id || !name) {
    alert("Enter ID and Name");
    return;
  }

  save(id, name);
}

// START SCANNER
function startScan() {
  if (!navigator.mediaDevices?.getUserMedia) {
    alert("Camera requires HTTPS and permission");
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    alert("QR library not loaded. Check internet or library file.");
    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    text => {
      let parts = text.split("|");

      if (parts.length >= 2) {
        save(parts[0].trim(), parts[1].trim());
      } else {
        document.getElementById("status").innerText =
          "QR format needs checking";
      }
    },
    () => {}
  ).catch(error => alert("Camera error: " + error));
}

// STOP SCANNER
function stopScan() {
  if (scanner) {
    scanner.stop().catch(() => {});
  }
}

// DISPLAY RECORDS
function render() {
  document.getElementById("records").innerHTML =
    records.map(r =>
      <div class="item">
        ${r.id} - ${r.name}<br>
        ${r.day} | ${r.time} | ${r.synced ? "Synced" : "Offline"}
      </div>
    ).join("");
}

function exportCSV() {
  let csv = "ID,Name,Date,Time\n" +
    records.map(r =>
      [r.id, r.name, r.day, r.time].join(",")
    ).join("\n");

  let a = document.createElement("a");
  a.href = URL.createObjectURL(
    new Blob([csv], { type: "text/csv" })
  );
  a.download = "TSE_Attendance.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

render();
</script>
</body>
</html>
